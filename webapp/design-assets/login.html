<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Cortex Graphite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#78dc86",
                        "primary-fixed": "#d8e2ff",
                        "on-primary-fixed-variant": "#004493",
                        "on-secondary-fixed-variant": "#42474e",
                        "surface-container": "#eceef0",
                        "inverse-on-surface": "#eff1f3",
                        "surface-variant": "#e0e3e5",
                        "error": "#ba1a1a",
                        "surface": "#f8f9fb",
                        "on-surface-variant": "#424753",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f2f4f6",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#94f99f",
                        "on-secondary-fixed": "#171c22",
                        "on-tertiary-container": "#c3ffc4",
                        "tertiary": "#006326",
                        "primary-container": "#0969da",
                        "outline": "#727785",
                        "on-primary-fixed": "#001a41",
                        "surface-dim": "#d8dadc",
                        "secondary-container": "#dee3eb",
                        "surface-container-high": "#e6e8ea",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-container": "#ecefff",
                        "secondary": "#5a5f66",
                        "primary-fixed-dim": "#adc6ff",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#dee3eb",
                        "on-tertiary-fixed": "#002108",
                        "primary": "#0051ae",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#00531e",
                        "background": "#f8f9fb",
                        "surface-tint": "#005bc0",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c2c6d6",
                        "on-secondary-container": "#60656c",
                        "inverse-primary": "#adc6ff",
                        "inverse-surface": "#2d3133",
                        "tertiary-container": "#0d7e34",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f8f9fb",
                        "secondary-fixed-dim": "#c2c7cf",
                        "on-surface": "#191c1e",
                        "on-background": "#191c1e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"],
                        "mono": ["ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "Liberation Mono", "Courier New", "monospace"]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed">
<main class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
<!-- Background Ambient Elements (Tonal Depth) -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-tertiary/5 blur-[120px]"></div>
<div class="w-full max-w-[440px] z-10">
<!-- Branding Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center mb-4">
<div class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary to-primary-container flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-3xl" data-icon="hub">hub</span>
</div>
</div>
<h1 class="font-headline text-3xl font-extrabold tracking-tighter text-on-surface mb-2">Cortex Graphite</h1>
<p class="text-on-surface-variant font-label text-sm tracking-tight">Technical Curator for Paperless-ngx</p>
</div>
<!-- Login Card (Layered Precision) -->
<div class="bg-surface-container-lowest rounded-xl p-10 shadow-[0px_12px_32px_rgba(25,28,30,0.06)] ring-1 ring-outline-variant/15">
<div class="mb-8">
<h2 class="text-xl font-bold tracking-tight text-on-surface mb-1">Welcome back</h2>
<p class="text-on-surface-variant text-sm">Please authenticate with your <span class="font-semibold text-primary">Paperless-ngx</span> credentials.</p>
</div>
<form class="space-y-6">
<!-- Username Field -->
<div class="space-y-2">
<label class="block font-label text-xs font-bold uppercase tracking-[0.05em] text-on-surface-variant px-1" for="username">Username</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</div>
<input autocomplete="username" class="w-full pl-11 pr-4 py-3 bg-surface-container-highest border-0 rounded-xl text-on-surface placeholder:text-outline/60 focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all outline-none" id="username" name="username" placeholder="Enter your username" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between px-1">
<label class="block font-label text-xs font-bold uppercase tracking-[0.05em] text-on-surface-variant" for="password">Password</label>
<a class="text-[11px] font-semibold text-primary hover:text-primary-container transition-colors" href="#">Forgot credentials?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input autocomplete="current-password" class="w-full pl-11 pr-4 py-3 bg-surface-container-highest border-0 rounded-xl text-on-surface placeholder:text-outline/60 focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-2">
<button class="w-full py-3.5 px-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold text-sm rounded-xl shadow-md hover:shadow-lg hover:opacity-95 transition-all transform active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary/20" type="submit">
                            Authenticate Instance
                        </button>
</div>
<div class="flex items-center space-x-2 py-2">
<div class="flex-1 h-px bg-outline-variant/15"></div>
<span class="text-[10px] font-bold uppercase tracking-widest text-outline">Instance Status</span>
<div class="flex-1 h-px bg-outline-variant/15"></div>
</div>
<div class="flex items-center justify-center space-x-4">
<div class="flex items-center space-x-1.5">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="text-[11px] font-medium text-on-surface-variant">LLM Node Active</span>
</div>
<div class="flex items-center space-x-1.5">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="text-[11px] font-medium text-on-surface-variant">Paperless Connected</span>
</div>
</div>
</form>
</div>
<!-- Footer Utility -->
<div class="mt-8 flex flex-col items-center space-y-4">
<p class="text-on-surface-variant text-[12px]">
                    Build v2.4.0 Graphite • <a class="hover:text-primary transition-colors underline underline-offset-4 decoration-outline-variant/30" href="#">Privacy Policy</a>
</p>
<div class="flex space-x-6">
<span class="material-symbols-outlined text-outline/40 text-[20px] cursor-help hover:text-primary transition-colors" data-icon="help">help</span>
<span class="material-symbols-outlined text-outline/40 text-[20px] cursor-pointer hover:text-primary transition-colors" data-icon="dark_mode">dark_mode</span>
</div>
</div>
</div>
<!-- Decorative UI Element (Asymmetric Data Module) -->
<div class="hidden lg:block absolute right-12 bottom-12 w-64 h-32 bg-surface-container rounded-xl p-6 ring-1 ring-outline-variant/10 opacity-40 select-none">
<div class="flex justify-between items-start mb-4">
<span class="font-label text-[10px] font-bold uppercase tracking-widest text-outline">Node Entropy</span>
<span class="material-symbols-outlined text-[16px] text-tertiary" data-icon="analytics">analytics</span>
</div>
<div class="h-12 w-full flex items-end space-x-1">
<div class="flex-1 bg-primary/20 h-[40%] rounded-t-sm"></div>
<div class="flex-1 bg-primary/20 h-[65%] rounded-t-sm"></div>
<div class="flex-1 bg-primary/20 h-[50%] rounded-t-sm"></div>
<div class="flex-1 bg-primary/30 h-[85%] rounded-t-sm"></div>
<div class="flex-1 bg-primary/20 h-[60%] rounded-t-sm"></div>
<div class="flex-1 bg-primary/40 h-[95%] rounded-t-sm"></div>
<div class="flex-1 bg-primary/20 h-[70%] rounded-t-sm"></div>
</div>
</div>
</main>
</body></html>
