# 1. STORAGE: Speicherplatz für die KI-Modelle (Llama, Mistral, etc.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi # Ausreichend Platz für mehrere große Modelle
---
# 2. DEPLOYMENT: Der Ollama-Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: paperless
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate # Verhindert GPU-Konflikte beim Update
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "apt-get update && apt-get install -y poppler-utils"]
        ports:
        - containerPort: 11434
          name: api
        env:
        - name: OLLAMA_KEEP_ALIVE
          value: "24h" # Modelle bleiben im Speicher für schnellere Reaktionen
        - name: OLLAMA_DEBUG # Diese Zeile hinzufügen
          value: "1"
        resources:
          #limits:
          #  nvidia.com/gpu: 1 # Reserviert die GPU für KI-Berechnungen
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            cpu: "10"
        volumeMounts:
        - name: model-storage
          mountPath: /root/.ollama
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: ollama-models-pvc
---
# 3. SERVICE: Interne Erreichbarkeit für paperless-aiassist
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: paperless
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
    protocol: TCP
    name: http
