apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-ai-ext
spec:
  ingressClassName: traefik
  rules:
    - host: paperless-aiext.dev4fun.cloud
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: paperless-ai-ext-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless-ai-ext-webapp
                port:
                  number: 80